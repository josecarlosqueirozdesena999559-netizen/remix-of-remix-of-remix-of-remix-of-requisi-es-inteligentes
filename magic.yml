workflows:
  ios-app-build-and-sign:
    name: Solicite Já Pereiro - iOS Build Assinado (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ios/SoliciteJaUsuario.xcodeproj
        XCODE_SCHEME: SoliciteJaUsuario
    scripts:
      - name: Build iOS Application
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.ipa

  ios-simulator-build:
    name: Solicite Já Pereiro - iOS Build (Sem Certificado / Teste)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ios/SoliciteJaUsuario.xcodeproj
        XCODE_SCHEME: SoliciteJaUsuario
    scripts:
      - name: Build app for iOS simulator
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/*.app
workflows:
  ios-app-build-and-sign:
    name: Solicite Já Pereiro - iOS Automatic Build & Signing (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.pereiro.soliciteja.usuario
      vars:
        XCODE_PROJECT: ios/SoliciteJaUsuario.xcodeproj
        XCODE_SCHEME: SoliciteJaUsuario
    scripts:
      - name: Configure Automatic Code Signing
        script: |
          xcode-project use-profiles
      - name: Build and Archive iOS App (.ipa)
        script: |
          xcodebuild build archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "build/ios/archive/SoliciteJaUsuario.xcarchive"
          
          xcodebuild -exportArchive \
            -archivePath "build/ios/archive/SoliciteJaUsuario.xcarchive" \
            -exportOptionsPlist export_options.plist \
            -exportPath "build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive